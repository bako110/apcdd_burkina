<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#28a745" />
    <title>APCDD — Association pour la Promotion de la Culture et du Développement Durable</title>
    <meta
      name="description"
      content="APCDD : promotion de la culture africaine et du développement durable au Burkina Faso. Adhérez, faites un don, découvrez nos actions."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('apcdd-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        overscroll-behavior-x: none;
        touch-action: pan-y;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #ffffff;
        transition: opacity 0.4s ease;
      }

      html.dark #app-loader {
        background: #171a1d;
      }

      #app-loader img {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        animation: app-loader-pulse 1.4s ease-in-out infinite;
      }

      #app-loader .app-loader-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(40, 167, 69, 0.2);
        border-top-color: #28a745;
        animation: app-loader-spin 0.8s linear infinite;
      }

      #app-loader.app-loader-hidden {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes app-loader-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loader img,
        #app-loader .app-loader-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-hidden="true">
      <img src="/logo.jpg" alt="" />
      <div class="app-loader-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
